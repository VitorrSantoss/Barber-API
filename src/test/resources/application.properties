spring.application.name=barbearia-api-test

# H2 em modo MySQL: os testes rodam as MESMAS migrations do Flyway que vão
# para o MySQL, sem depender de banco local nem apagar dados de dev.
spring.datasource.url=jdbc:h2:mem:barbearia;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173
app.clientes.dias-inatividade=90
# Jobs agendados não devem disparar sozinhos no meio dos testes
app.clientes.limpeza-cron=-
app.agendamentos.auto-status-intervalo-ms=3600000
app.swagger.auto-open=false

app.auth.max-tentativas=3
app.auth.bloqueio-segundos=30
app.barbeiros.senhas-iniciais=
