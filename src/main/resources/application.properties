spring.application.name=barbearia-api

# Variáveis locais (DB_PASSWORD etc.) podem ficar num arquivo .env na raiz do
# projeto - ele é ignorado pelo git. Ver .env.example.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

# ──────────────────────────────────────────────────────────────────────────────
# Banco de dados (credenciais SEMPRE via variável de ambiente)
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/barbearia}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# O schema é responsabilidade do Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Bancos criados antes do Flyway (pelo antigo ddl-auto=update) já estão no
# estado da V1: são marcados como V1 e recebem só as migrations seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.error.include-stacktrace=never

# ──────────────────────────────────────────────────────────────────────────────
# Regras da aplicação
# ──────────────────────────────────────────────────────────────────────────────
# Origens do front liberadas para HTTP e WebSocket (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Remoção de clientes inativos
app.clientes.dias-inatividade=90
app.clientes.limpeza-cron=0 0 3 * * *

# Intervalo do job que move agendamentos AGENDADO -> AGUARDANDO (ms)
app.agendamentos.auto-status-intervalo-ms=60000

app.swagger.auto-open=false

# ──────────────────────────────────────────────────────────────────────────────
# Login do barbeiro
# ──────────────────────────────────────────────────────────────────────────────
# Tentativas erradas seguidas (por IP) antes de bloquear o login por alguns segundos
app.auth.max-tentativas=5
app.auth.bloqueio-segundos=30

# Senhas iniciais "Nome:123456,Outro:654321" - só vale para barbeiro sem senha.
# Defina no .env (fora do git); no banco fica só o hash.
app.barbeiros.senhas-iniciais=${BARBEIROS_SENHAS_INICIAIS:}
